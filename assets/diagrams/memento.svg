<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="title desc">
  <title id="title">Memento example map</title>
  <desc id="desc">Caretaker flows through Editor::Snapshot to Editor::restore().</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto"><path d="M1 1 L4.5 8 L8 1" fill="none" stroke="#b94e28" stroke-width="1.8"/></marker></defs>
  <style>.role{font:700 12px ui-monospace,monospace;letter-spacing:1px;fill:#a84320}.name{font:600 19px ui-monospace,monospace;fill:#2d211b}.note{font:13px ui-monospace,monospace;fill:#674d3c}</style>
  <rect width="420" height="520" fill="#ead3ae"/>
  <path d="M12 15 Q210 10 408 16 M12 505 Q210 511 408 505" fill="none" stroke="#b88d65" stroke-width="1" stroke-dasharray="5 7"/>
  <path d="M25 34 L395 30 L398 140 L22 143 Z" fill="#fff5df" stroke="#6b402b" stroke-width="2" stroke-linejoin="round"/><text x="43" y="62" class="role">CALLER</text><text x="43" y="98" class="name">Caretaker</text><path d="M205 146 q-3 8 0 15" fill="none" stroke="#b94e28" stroke-width="3" marker-end="url(#arrow)"/><path d="M25 174 L395 170 L398 280 L22 283 Z" fill="#fff5df" stroke="#6b402b" stroke-width="2" stroke-linejoin="round"/><text x="43" y="202" class="role">PATTERN BOUNDARY</text><text x="43" y="238" class="name">Editor::Snapshot</text><path d="M205 286 q-3 8 0 15" fill="none" stroke="#b94e28" stroke-width="3" marker-end="url(#arrow)"/><path d="M25 314 L395 310 L398 420 L22 423 Z" fill="#fff5df" stroke="#6b402b" stroke-width="2" stroke-linejoin="round"/><text x="43" y="342" class="role">COLLABORATOR / RESULT</text><text x="43" y="378" class="name">Editor::restore()</text>
  <text x="24" y="477" class="note">Trace the call, then inspect the result.</text>
</svg>
