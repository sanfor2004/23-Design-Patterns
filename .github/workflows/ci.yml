name: Examples and documentation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  examples:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: GCC
            cmake_args: -DCMAKE_CXX_COMPILER=g++
            python: '3.10'
          - os: ubuntu-latest
            compiler: Clang
            cmake_args: -DCMAKE_CXX_COMPILER=clang++
            python: '3.14'
          - os: windows-latest
            compiler: MSVC
            cmake_args: -A x64
            python: '3.14'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug ${{ matrix.cmake_args }}
      - name: Build C++20 examples
        run: cmake --build build --config Debug --parallel 2
      - name: Test C++20 output
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Test Python output
        run: python scripts/test_python.py
      - name: Validate documentation
        run: python -X utf8 scripts/validate_docs.py
